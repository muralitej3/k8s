apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploy
  namespace: dev
spec:
  replicas: 5
  selector:
    matchLabels:
      app: bang-deploy
  template:
    metadata:
      labels:
        app: bang-deploy
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: cont1
        image: chakalimurali/murali:v1
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: murali
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
